name: Release Disco Inferno

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to upload (e.g. 1.2.0)
        required: true
      changelog:
        description: Changelog text for the mod page (dispatch runs have no release body)
        required: false

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        run: echo "VERSION=${{ github.event.release.tag_name || inputs.version }}" >> "$GITHUB_ENV"

      - name: Package (no git artefacts)
        run: |
          git archive --format=zip --prefix="Disco Inferno/" \
            -o "Disco-Inferno-${VERSION}.zip" HEAD

      - name: Verify zip contents
        run: |
          unzip -l "Disco-Inferno-${VERSION}.zip"
          if unzip -l "Disco-Inferno-${VERSION}.zip" | grep -E '\.git|\.github'; then
            echo "Git artefacts found in zip" && exit 1
          fi
          unzip -l "Disco-Inferno-${VERSION}.zip" | grep -q 'Disco Inferno/Disco Inferno.mod' \
            || { echo "Missing Disco Inferno.mod" && exit 1; }
          unzip -l "Disco-Inferno-${VERSION}.zip" | grep -q 'Disco Inferno/info.json' \
            || { echo "Missing info.json" && exit 1; }

      - name: Package no-music variant (bring your own music)
        run: |
          cp "Disco-Inferno-${VERSION}.zip" "Disco-Inferno-NoMusic-${VERSION}.zip"
          zip -d "Disco-Inferno-NoMusic-${VERSION}.zip" "Disco Inferno/audio/*" || true
          mkdir -p "Disco Inferno/audio"
          printf 'Disco Inferno - audio folder\n============================\n\nThis is the NO-MUSIC build: drop your own heavy-metal snippets in THIS folder\nand they are picked up automatically. Supported: .mp3 .ogg .opus .wav .flac\n.m4a .aac .mp4 .webm .mkv (audio track) and more.\n\nWhen the Skitarii Purgator servo skull unleashes its flamethrower, one random\ntrack from this folder plays and the eyes light up. Short clips (15-40s) work\nbest. Per-track volume / strobe / colour: type /di in chat. Requires SimpleAudio.\n' > "Disco Inferno/audio/README.txt"
          zip "Disco-Inferno-NoMusic-${VERSION}.zip" "Disco Inferno/audio/README.txt"

      - name: Verify no-music variant
        run: |
          unzip -l "Disco-Inferno-NoMusic-${VERSION}.zip"
          if unzip -l "Disco-Inferno-NoMusic-${VERSION}.zip" | grep -Ei '\.(opus|mp3|ogg|wav|flac|m4a|aac|mp4|webm|mkv|mov|flv)'; then
            echo "Audio leaked into no-music variant" && exit 1
          fi
          unzip -l "Disco-Inferno-NoMusic-${VERSION}.zip" | grep -q 'Disco Inferno/Disco Inferno.mod' \
            || { echo "Missing Disco Inferno.mod" && exit 1; }
          unzip -l "Disco-Inferno-NoMusic-${VERSION}.zip" | grep -q 'Disco Inferno/audio/README.txt' \
            || { echo "Missing audio placeholder" && exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Disco-Inferno-${{ env.VERSION }}
          path: |
            Disco-Inferno-${{ env.VERSION }}.zip
            Disco-Inferno-NoMusic-${{ env.VERSION }}.zip

      - name: Resolve Nexus file_id (v2 GraphQL groupId)
        if: ${{ !github.event.release.prerelease }}
        run: |
          FID=$(curl -sS -H "apikey: ${{ secrets.NEXUSMODS_APIKEY }}" -H "content-type: application/json" \
            -X POST "https://api.nexusmods.com/v2/graphql" \
            -d '{"query":"query{modFiles(modId:\"${{ vars.NEXUS_MOD_ID }}\",gameId:\"4943\"){primary category groupId}}"}' \
            | jq -r '([.data.modFiles[]|select(.primary==1)]+[.data.modFiles[]|select(.category=="MAIN")])[0].groupId')
          if [ -z "$FID" ] || [ "$FID" = "null" ]; then echo "no groupId" && exit 1; fi
          echo "NEXUS_FILE_ID=$FID" >> "$GITHUB_ENV"

      - name: Resolve Nexus global mod id (v3)
        if: ${{ !github.event.release.prerelease }}
        run: |
          MID=$(curl -sS -H "apikey: ${{ secrets.NEXUSMODS_APIKEY }}" \
            "https://api.nexusmods.com/v3/games/warhammer40kdarktide/mods/${{ vars.NEXUS_MOD_ID }}" \
            | jq -r '.data.id')
          if [ -z "$MID" ] || [ "$MID" = "null" ]; then echo "no global mod id" && exit 1; fi
          echo "NEXUS_GLOBAL_MOD_ID=$MID" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        if: ${{ !github.event.release.prerelease }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          filename: Disco-Inferno-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          display_name: Disco Inferno ${{ env.VERSION }}
          category: main
          description: ${{ github.event.release.body || inputs.changelog }}
          mod_id: ${{ env.NEXUS_GLOBAL_MOD_ID }}
          changelog: ${{ github.event.release.body || inputs.changelog }}
          update_mod_version: true
      - name: Upload no-music variant to Nexus Mods
        if: ${{ !github.event.release.prerelease && vars.NEXUS_NOMUSIC_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_APIKEY }}
          file_id: ${{ vars.NEXUS_NOMUSIC_FILE_ID }}
          filename: Disco-Inferno-NoMusic-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          display_name: Disco Inferno (Bring Your Own Music) ${{ env.VERSION }}
          category: optional
          description: ${{ github.event.release.body }}
